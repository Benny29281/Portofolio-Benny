name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository without submodules
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set the portfolio URL in the published files
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          test -f github-pages/index.html
          test -n "$PAGES_URL"
          site_url="${PAGES_URL%/}/"
          sed -i -E "s~https://benny29281\.github\.io/(portofolio|Portofolio-Benny)/~$site_url~g" github-pages/index.html github-pages/sitemap.xml

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
